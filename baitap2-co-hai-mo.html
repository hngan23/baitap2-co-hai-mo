<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cô hái mơ</title>
    <style>
        .khung-tho {
            width: 560px;
            max-width: 95%;
            margin: 30px auto;
            padding: 18px 28px 22px 28px;
            border: 1.5px solid #444;
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
            color: #111;
            box-sizing: border-box;
        }
        .khung-tho h2 {
            text-align: center;
            margin: 0 0 14px 0;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .khung-tho pre {
            margin: 0;
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
            line-height: 1.45;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="khung-tho">
        <h2>CÔ HÁI MƠ</h2>
        <pre><i>Thơ thẩn đường chiều một khách thơ,
Say nhìn xa rặng núi xanh lơ,</i>
Khi trời lặng lẽ và trong trẻo,
Thấp thoáng rừng mơ, <b>Cô hái mơ</b>.
<u>Tác giả:</u> <s><i>Vô danh</i></s></pre>
    </div>
</body>
</html>
